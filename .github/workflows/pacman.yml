name: Generate Pac-Man Game

on:
  schedule:
    - cron: "0 0 * * *"   # প্রতিদিন UTC সময়ে রাত ১২টায় অটোমেটিক রান
  workflow_dispatch:       # ম্যানুয়ালি রান করার অপশন

jobs:
  generate:
    permissions:
      contents: write      # রিপোজিটরিতে ফাইল পুশ করার অনুমতি
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          game: pacman       # অন্যান্য গেম: breakout, galaga, puzzle-bobble, bomberman, minesweeper[reference:6]

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
